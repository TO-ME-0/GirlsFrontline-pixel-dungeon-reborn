actors.mobs.npcs.imp.name=ambitious imp
actors.mobs.npcs.imp.old_intro=Are you an adventurer? I love adventurers! You can always rely on them if something needs to be killed, am I right? For a bounty of course ;)
actors.mobs.npcs.imp.old_golems_1=In my case it's _golems_ that need to be killed. You see, I'm going to start a little business here, but those stupid golems are bad for business! It's very hard to negotiate with wandering lumps of granite, damn them! So please kill... let's say _4 of them_ and a reward is yours.
actors.mobs.npcs.imp.old_monks_1=In my case it's _monks_ who need to be killed. You see, I'm going to start a little business here, but those lunatics don't buy anything themselves and will scare away other customers. So please kill... let's say _5 of them_ and a reward is yours.
actors.mobs.npcs.imp.old_golems_2=How is your golem safari going? Just don't forget to grab those tokens.
actors.mobs.npcs.imp.old_monks_2=Oh, you're still alive! I knew that your kung-fu would be stronger ;) Just don't forget to grab those tokens.
actors.mobs.npcs.imp.cya=See you, %s!
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.quest_intro_1=Oh hello, are you an adventurer? I love adventurers! You can always rely on them when you need a hand. With an appropriate reward, of course ;).\n\nThere's a big dwarven vault in front of me that's got a bunch of rare artifacts inside of it. I'm a collector of sorts, and there's a statuette in that vault that I want very much.\n\nThe vault is full of guardians and traps though, so I could use a little help!
actors.mobs.npcs.imp.quest_intro_2=The vault's magically sealed. I can teleport you in with a spell I've been preparing, but _I can't teleport your gear with you._ There should be plenty of loot inside of the vault to help you along though! _You'll probably want to start out by avoiding enemies and looking for items that aren't as well protected._\n\nI can recall you with two items from the vault. One will be my statuette, and the other can be _anything from the vault that you like!_\n\nI've collected a bunch of valuables that you might be interested in too! If you help me here I'll _set up shop a little further down_ and we can trade.
actors.mobs.npcs.imp.quest_in_progress=Just step into the center of the vault entrance when you're ready to go and I'll teleport you inside.
actors.mobs.npcs.imp.enter_text=Are you ready? I'll keep your items safe up here, _you'll get everything back when you return._\n\nTake this _cloth armor_ and _teleport crystal_ with you though. Use the crystal when you have my statuette. ...I suppose _you can use it early too if you're in trouble_, but don't expect the full reward!\n\nThe vault hasn't been disturbed for a long time, so enemies in it should be more sluggish than usual. It should be easier than normal to avoid detection, especially if _you stay behind the direction enemies wander in._ If any enemy does see you they _shouldn't chase you if they only see you for a moment._ You'll probably also be able to _sense nearby footsteps_ if you pay attention.
actors.mobs.npcs.imp.quest_completed_bad=Well, thanks for trying.\n\nThe spell I used to access the vault will take a very long time to prepare again, so you'd better be on your way.
actors.mobs.npcs.imp.quest_completed_good=Thanks for your help!\n\nIt'll take me some time to get my teleportation spell ready, and I'll need to plan things out based on the information you've given me as well.\n\nI'll get packed up and see you a bit further into the dungeon. Afraid I do still need gold, so my wares won't be free ;).
actors.mobs.npcs.imp.quest_completed_great=Great job down there, thanks so much!\n\nI've got everything I need here, so I'll get packed up and see you a bit further into the dungeon. Afraid I do still need gold, so my wares won't be free ;).\n\nWhat was so important about the statue? Nothing you might think, it's actually a pretty mundane object. It comes from a faraway land that no longer exists; it might be the last of its kind. If it weren't for these greedy dwarves it would have probably been destroyed along with everything else...
actors.mobs.npcs.imp.enter_yes=Descend into the vault
actors.mobs.npcs.imp.enter_no=Stay here
actors.mobs.npcs.imp.desc=This little red person look like an Imp. Imps are lesser demons, notable for their intelligence and not their strength.\n\nYou've only heard about demons in ancient folk tales though, which usually describe them as travelers from another world. You've never seen any evidence demons actually exist, but this Imp is clearly real and seems very happy to see you.
actors.mobs.quest.vault.vaultbosselemental.name=greater elemental
actors.mobs.quest.vault.vaultbosselemental.rankings_desc=Overwhelmed by the Greater Elemental
actors.mobs.quest.vault.vaultbosselemental.discover_hint=You can find this enemy during a specific quest.
actors.mobs.quest.vault.vaultbosselemental.desc=Representing the pinnacle of dwarven summoning magic, this massive elemental's unstable power seems to be regulated by the equally impressive circle that summoned it. This gives it the ability to _swap forms!_ Each form has unique attacks, resistances, and weaknesses.
actors.mobs.quest.vault.vaultbosselemental.desc_fire=The elemental is currently assuming a molten hot _fiery form_. In this form it can shoot fireballs and summon waves of flame that sweep across the arena. It will try to aim fireballs in the direction you are moving, and the fire waves always have a gap. If you're hit by either you'll be _ignited_.\n\nIn this form it is _resistant to magic_, which only serves to fuel the flames. Its vulnerable molten core could probably be easily hit with _ranged weapons_ however.
actors.mobs.quest.vault.vaultbosselemental.fire_resist=The flames grow as the elemental absorbs most of your magic attack!
actors.mobs.quest.vault.vaultbosselemental.fire_weak=Your thrown weapon strikes the elemental's core, dealing extra damage!
actors.mobs.quest.vault.vaultbosselemental.desc_frost=The elemental is currently assuming a frigid _frost form_. In this form it can shoot a sweeping cone of cold and summon a vortex of moving frigid air. Both of these attacks can be stepped around with good timing, but the cone is especially deadly at a distance. If you're hit by either you will _freeze solid_.\n\nIn this form it is also _resistant to thrown weapons_, which will just stick to its icy shell. The shell doesn't look especially durable though, so a hit with a _melee weapon_ should be especially damaging.
actors.mobs.quest.vault.vaultbosselemental.frost_resist=The thrown weapon sticks to the elemenental's frost shell!
actors.mobs.quest.vault.vaultbosselemental.frost_weak=Your melee strike shatters some of the frost shell, dealing extra damage!
actors.mobs.quest.vault.vaultbosselemental.desc_shock=The elemental is currently assuming an electric _shock form_. In this form it can fire a bolt of lightning at your location, or summon lines of sparks from the sides of the arena. These attacks are a bit easier to dodge, but it can do them more frequently. If you're hit by either you will be _momentarily stunned_.\n\nIn this form it is also _resistant to melee attacks_, which will cause a painful jolt. The energy surrounding it will be destabilized by _magic_ however, inflicting additional damage.
actors.mobs.quest.vault.vaultbosselemental.shock_resist=As you try to strike you receive a painful jolt!
actors.mobs.quest.vault.vaultbosselemental.shock_weak=The magic disrupts the elemental's electric field, dealing extra damage!
actors.mobs.quest.vault.vaultdm100.name=modified DM-100
actors.mobs.quest.vault.vaultdm100.discover_hint=You can find this enemy during a specific quest.
actors.mobs.quest.vault.vaultdm100.desc=These DM-100s look almost identical to ones you'd find in the prison, but with a bright teal glow coming from their eye. Probably they have been retrofitted to use some more modern dwarven power source.\n\nThey act just like regular DM-100s. Their ability to arc lightning at a distance is still present despite the power source change, and their cleaner condition makes them a bit more durable.
actors.mobs.quest.vault.vaultdm200.name=modified DM-200
actors.mobs.quest.vault.vaultdm200.discover_hint=You can find this enemy during a specific quest.
actors.mobs.quest.vault.vaultdm200.desc=These DM-200s look just like their counterparts from the caves, but with glowing teal eyes. They have probably been retrofitted with a more modern dwarven power source.\n\nJust like in their caves counterparts, these DM-200s are too large to fit into enclosed spaces, and are still capable of spewing gas.
actors.mobs.quest.vault.vaultrat.desc=This rat has some behaviour changes to test out new vault enemy AI:\n_-_ Its movement can be 'heard' through walls\n_-_ It will wander along a pre-set patrol\n_-_ While wandering it has sharply reduced detection range behind the direction it moves in.\n_-_ While sleeping its detection range is also reduced\n_-_ When it detects you it will 'investigate' before swapping to hunting. Investigating enemies move toward you but don't attack and are easier to lose behind doors and corners.
actors.mobs.quest.vault.vaultskeleton.name=dwarven skeleton
actors.mobs.quest.vault.vaultskeleton.discover_hint=You can find this enemy during a specific quest.
actors.mobs.quest.vault.vaultskeleton.desc=These would look like normal skeletons from the prison if it weren't for their stunning amount of facial hair. It seems like some dwarves weren't above necromancy even before their new King took over.\n\nThey act just like regular skeletons, including exploding into bone shards on death. Paradoxically, their beards seem to offer them a little more protection too.
actors.mobs.quest.vault.vaultshaman.name=captured shaman
actors.mobs.quest.vault.vaultshaman.discover_hint=You can find this enemy during a specific quest.
actors.mobs.quest.vault.vaultshaman.desc=These gnoll shamans are clearly from the caves, but have a strange metal mask that looks dwarven. The fit on the mask is extremely tight, and the shamans move in an awkward stilted manner. Is the mask made to control them?
actors.mobs.quest.vault.vaultshaman.spell_desc=These gnolls are surely still capable of zapping you with magic, but without a mask color there's no telling what kind of magic they will use. The metal mask also seems to protect them a bit more than a wooden one, and there's significantly more force behind their attacks than a regular gnoll shaman.
actors.mobs.npcs.vaultlaser.name=disintegration sentry
actors.mobs.npcs.vaultlaser.ondeath=You were killed by the disintegration ray...
actors.mobs.npcs.vaultlaser.desc=These sentries fire rays of disintegration magic at regular or semi-random intervals. The beams look quite hazardous, but they always seem to go to the same place at least. It doesn't look like there's any way to resist the disintegration beams, so _you'll have to avoid them in some way_.
actors.mobs.npcs.vaultsentry.name=scanning sentry
actors.mobs.npcs.vaultsentry.ondeath=The lightning bolt killed you...
actors.mobs.npcs.vaultsentry.desc=These sentries scan the area in a pre-set pattern. They look quite hazardous, you'll surely be zapped if you are detected by the scan. The pattern can often be avoided, but the sentries also have to visually see you in order to detect you, so _anything that obscures vision is effective against them_.
actors.mobs.npcs.vaulttokendoor.name=strange door
actors.mobs.npcs.vaulttokendoor.def_verb=blocked
actors.mobs.npcs.vaulttokendoor.desc=This seemingly unlocked door won't budge, and has an unusual mechanism along its surface. There are ten indentations that look like some sort of flat diamond-shaped object would fit into them.
actors.mobs.npcs.vaulttokendoor.no_tokens=_Perhaps something you can find in the vault might fit here?_
actors.mobs.npcs.vaulttokendoor.too_few_tokens=_Your dwarven tokens fit the indentations perfectly_, but you don't have enough of them.
actors.mobs.npcs.vaulttokendoor.enough_tokens=_You have enough dwarven tokens to fill every indentation_, do you want to place them into the door?
actors.mobs.npcs.vaulttokendoor.open=Open the Door
actors.mobs.npcs.vaulttokendoor.not_yet=Not Yet
actors.mobs.npcs.vaulttokendoor.unlocked=The tokens seem to merge into the door and you hear the distinct click of a lock opening.
actors.mobs.npcs.vaultmirror.name=Strange Mirror
actors.mobs.npcs.vaultmirror.def_verb=blocked
actors.mobs.npcs.vaultmirror.desc=This large mirror is inscribed with various glowing dwarven runes, it hums glenty but doesn't seem to actually reflect anything.
actors.mobs.npcs.vaultmirror.approach=Before you stands a large mirror with thin glowing runes etched into its opulent golden frame. The mirror's surface is pitch black, until you get close. As you lean toward the mirror the runes flash brightly and a shockingly familiar scene appears behind the glass.
actors.mobs.npcs.vaultmirror.scene_warrior=You see your red _wax seal_, chopped in half and partly buried in the snow. The scene is almost like a memory, but the details are different. You could never bear to throw the seal away, keeping it felt like a part of your punishment. You've also spent a long time looking at it, and the break is at a slightly different angle.
actors.mobs.npcs.vaultmirror.scene_mage=You see your _magical staff_ resting on a table in a study. The scene is almost like a memory, but the details are different. This was your public office at the southern wizarding institute; far too visible of a location to keep the staff. The office looks more lived in than it should be as well, you never cared to do real work there.
actors.mobs.npcs.vaultmirror.scene_rogue=You see the _Cloak of Shadows_, gently resting on a stand in the royal armory. The scene is almost like a memory, but the details are different. The armory is still and quiet, and the guard on duty is calmly scanning over the room with a kind look in his eyes. There's a familiar twinge of guilt as you see him standing peacefully and unharmed.
actors.mobs.npcs.vaultmirror.scene_huntress=You see your _spirit bow_ placed on a large flat circular stone surrounded by dense forest. The scene is almost like a memory, but the details are different. The small clearing around the stone is quiet and empty, completely unlike the celebration when you were given your bow. In fact, you can't sense anything from the surrounding nature at all.
actors.mobs.npcs.vaultmirror.scene_duelist=You see a tall figure clad in royal guard armor standing before you: your late father. The scene is almost like a memory, but the details are different. The kind look in his eyes is exactly as you remember, but his face is weathered by years that he never got to live. He holds out his _enchanted greatsword_ for you to take.
actors.mobs.npcs.vaultmirror.scene_cleric=You see an opened reliquary coffer in a brighlty lit chapel, containing the _holy tome_. The scene is almost like a memory, but the details are different. You never took the reliquary out of storage, only the tome itself. The divine energies radiating from the tome feel unusual too, as though it is channeling energy from a different source.
actors.mobs.npcs.vaultmirror.scene_final=You notice that the glass surface of the mirror is completely gone, there's nothing stopping you from reaching in and taking the item.
actors.mobs.npcs.vaultmirror.take=Take the Item
actors.mobs.npcs.vaultmirror.scene_take=As you reach in and take the item the scene is unchanged, as if the item exists in two places at once.\n\nThe image in the mirror fades, and the item in your hand seems to gently pulse with the same rhythm as the runes around the mirror.\n\nYou're not really sure what just happened but the item's existence seems tied to the mirror, you probably won't be able to take it out of the vault.
actors.mobs.npcs.vaultmirror.scene_nothing=You approach the mirror again but nothing happens. Its surface is smooth and solid, you can just barely see the reflection of your fingertips as you touch the glass.
