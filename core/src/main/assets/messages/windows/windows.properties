###wnd festival window (shown when tapping the festival-colored date on floor 0)
windows.wndfestival.spring_festival.name=春节
windows.wndfestival.spring_festival.desc=农历正月初一至初七，中华民族最隆重的传统节日。家家户户贴春联、放鞭炮、吃年夜饭，走亲访友互道新年好。
windows.wndfestival.lantern_festival.name=元宵节
windows.wndfestival.lantern_festival.desc=农历正月十五，又称上元节。赏花灯、猜灯谜、吃元宵，寓意团团圆圆。
windows.wndfestival.qingming.name=清明节
windows.wndfestival.qingming.desc=公历4月4日至6日，既是节气也是节日。踏青郊游、扫墓祭祖，缅怀先人。
windows.wndfestival.dragon_boat.name=端午节
windows.wndfestival.dragon_boat.desc=农历五月初五，纪念屈原。赛龙舟、吃粽子、挂艾草，驱邪避疫。
windows.wndfestival.qixi.name=七夕节
windows.wndfestival.qixi.desc=农历七月初七，牛郎织女鹊桥相会的日子，被誉为中国的情人节。
windows.wndfestival.double_ninth.name=重阳节
windows.wndfestival.double_ninth.desc=农历九月初九，二九相重。登高望远、赏菊饮酒、遍插茱萸，寓意长寿安康。
windows.wndfestival.national_day.name=国庆节
windows.wndfestival.national_day.desc=公历10月1日至7日，庆祝中华人民共和国成立。举国欢庆，共祝祖国繁荣昌盛。
windows.wndfestival.mid_autumn.name=中秋节
windows.wndfestival.mid_autumn.desc=农历八月十五，月圆人团圆。赏月、吃月饼、饮桂花酒，寄托对故乡与亲人的思念。
windows.wndfestival.xmas.name=圣诞节
windows.wndfestival.xmas.desc=12月25日，西方传统节日。互赠礼物、装饰圣诞树，分享喜悦与祝福。
windows.wndfestival.hween.name=万圣节
windows.wndfestival.hween.desc=10月31日，西方传统节日。南瓜灯、化装舞会，孩子们挨家挨户索要糖果。
windows.wndfestival.bread.name=面包节
windows.wndfestival.bread.desc=源自韩国的节日，在这一天人们会烤制面包，分享丰收的喜悦。
windows.wndfestival.easter.name=复活节
windows.wndfestival.easter.desc=基督教纪念耶稣复活的节日，象征重生与希望。彩蛋和兔子是其经典象征。
windows.wndfestival.special_day.name=特别的日子
windows.wndfestival.special_day.desc=今天是你设定的特别日子，愿你被温柔以待。
windows.wndfestival.none.name=今日
windows.wndfestival.none.desc=今天是普通的一天，继续冒险吧！

